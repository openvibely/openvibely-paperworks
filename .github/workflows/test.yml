name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record office setup start time
        run: date +%s%N > "$RUNNER_TEMP/office-setup-start-ns"

      # This cache stores downloaded .deb files only. apt-get update still
      # refreshes package indexes on every run, and apt installs current
      # repository candidates; stale cached versions are ignored by apt.
      - name: Cache Office package downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/paperworks-apt/archives/*.deb
          key: apt-office-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ hashFiles('.github/workflows/test.yml') }}-${{ github.run_id }}
          restore-keys: |
            apt-office-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ hashFiles('.github/workflows/test.yml') }}-

      - name: Install and verify Office test dependencies
        run: |
          office_setup_start_ns="$(cat "$RUNNER_TEMP/office-setup-start-ns")"
          report_office_setup_duration() {
            setup_status=$?
            trap - EXIT
            office_setup_end_ns="$(date +%s%N)"
            office_setup_ms=$(((office_setup_end_ns - office_setup_start_ns) / 1000000))
            echo "Office dependency setup elapsed: ${office_setup_ms} ms (exit ${setup_status})"
            echo "Office dependency setup: ${office_setup_ms} ms (exit ${setup_status})" >> "$GITHUB_STEP_SUMMARY"
            exit "$setup_status"
          }
          trap report_office_setup_duration EXIT

          apt_archives="$HOME/.cache/paperworks-apt/archives"
          mkdir -p "$apt_archives/partial"
          sudo chown _apt:root "$apt_archives/partial"
          sudo chmod 700 "$apt_archives/partial"
          sudo apt-get -o "Dir::Cache::archives=$apt_archives/" update
          sudo apt-get -o "Dir::Cache::archives=$apt_archives/" -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
            libreoffice-writer \
            libreoffice-calc \
            libreoffice-impress \
            fonts-liberation \
            fonts-dejavu-core \
            fonts-noto-core
          sudo apt-get -o "Dir::Cache::archives=$apt_archives/" autoclean
          bash scripts/verify-office-deps.sh

      - uses: actions/cache@v4
        with:
          path: ~/.cache/paperworks-tests
          key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-local.sh') }}
      - name: Set up cached test dependencies
        run: make deps
      - name: Test and vet
        run: PAPERWORKS_TEST_JSON="$RUNNER_TEMP/tests.jsonl" bash scripts/test.sh
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/tests.jsonl
          if-no-files-found: ignore

  report-test-job-duration:
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Report completed test job duration
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          python3 -c '
          import datetime
          import json
          import os
          import sys

          jobs = json.load(sys.stdin)["jobs"]
          matches = [job for job in jobs if job["name"] == "test"]
          if len(matches) != 1:
              raise SystemExit(f"expected one completed test job, found {len(matches)}")
          job = matches[0]
          if not job["started_at"] or not job["completed_at"]:
              raise SystemExit("test job has no completed timing timestamps")
          start = datetime.datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
          end = datetime.datetime.fromisoformat(job["completed_at"].replace("Z", "+00:00"))
          elapsed_ms = int((end - start).total_seconds() * 1000)
          if elapsed_ms < 0:
              raise SystemExit("test job completed before it started")
          report = f"Test job duration: {elapsed_ms} ms ({elapsed_ms / 1000:.3f} s)\n"
          print(report, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Test job duration\n\n")
              summary.write(f"{elapsed_ms} ms ({elapsed_ms / 1000:.3f} s)\n")
          ' <<< "$response"
